name: Deploy Frontend (P1/docs) to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "P1/docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload static site from P1/docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: "P1/docs"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
